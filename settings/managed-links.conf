# SharedConfigs-managed links
#
# Format:
#   name|group|kind|policy|machines|source-relative-to-SharedConfigs|destination-relative-to-HOME
#
# policy is required or optional. machines is all or a comma-separated list of
# preferred short names from ~/.codex-machine.md. Fields must not be empty.
# kind is file or directory. Paths must be relative and may not contain . or ..
# components. The audit compares resolved filesystem identity, so a correct
# relative link and a correct absolute link are treated equivalently.

texmf|texmf|directory|required|all|texmf|Library/texmf
codex-global-instructions|codex|file|required|all|codex/AGENTS.md|.codex/AGENTS.md
zshenv|zsh|file|required|all|settings/zsh/zshenv|.zshenv
zprofile|zsh|file|required|all|settings/zsh/zprofile|.zprofile
zshrc|zsh|file|required|all|settings/zsh/zshrc|.zshrc
warp-settings|warp|file|required|all|settings/warp/settings.toml|.warp/settings.toml
warp-keybindings|warp|file|required|all|settings/warp/keybindings.yaml|.warp/keybindings.yaml
warp-startup-config|warp|file|required|all|settings/warp/tab_configs/startup_config.toml|.warp/tab_configs/startup_config.toml
starship-config|starship|file|required|all|settings/terminal/starship.toml|.config/starship.toml
markedit-preview-script|markedit|file|required|all|settings/MarkEdit/scripts/markedit-preview.js|Library/Containers/app.cyan.markedit/Data/Documents/scripts/markedit-preview.js
markedit-preview-style|markedit|file|required|all|settings/MarkEdit/styles/preview-light.css|Library/Containers/app.cyan.markedit/Data/Documents/styles/preview-light.css
markedit-settings|markedit|file|required|all|settings/MarkEdit/settings.json|Library/Containers/app.cyan.markedit/Data/Documents/settings.json
