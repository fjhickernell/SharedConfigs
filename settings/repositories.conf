# Managed repository registry
#
# Codex maintains this file when the user asks to add a repository to the
# sweep or archive one. Do not delete archived rows: change the first field
# from "current" to "archived" so the history and intended workflow remain
# visible without including the repository in routine checks or syncs.
#
# Format (pipe-delimited, one repository per line):
# status|workflow|name|home-relative path|expected branch|expected origin
#
# status:   current | archived
# workflow: active | dev | infrastructure
# path:     relative to $HOME; an absolute path is also accepted
# branch:   required for dev/infrastructure; blank lets an active checkout use
#           its checked-out branch and upstream
# origin:   required for every row

